<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" width="300" height="440">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="45%" stop-color="#EFE8DE" />
      <stop offset="100%" stop-color="#DFD3C3" />
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(36, 28, 24, 0.28)" />
      <stop offset="4%" stop-color="rgba(36, 28, 24, 0.12)" />
      <stop offset="14%" stop-color="rgba(36, 28, 24, 0.03)" />
      <stop offset="100%" stop-color="rgba(36, 28, 24, 0)" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C4B5" />
      <stop offset="100%" stop-color="#BAA594" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#241C18" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Hardcover Base Canvas -->
  <rect x="0" y="0" width="300" height="440" rx="8" ry="8" fill="url(#coverBg)" />

  <!-- Realistic Spine Crease Shadow -->
  <rect x="0" y="0" width="32" height="440" rx="4" fill="url(#spineShadow)" />
  <line x1="26" y1="0" x2="26" y2="440" stroke="#CBBBAA" stroke-width="1" opacity="0.6" />

  <!-- Outer Decorative Debossed Border -->
  <rect x="22" y="22" width="256" height="396" rx="6" fill="none" stroke="url(#borderGlow)" stroke-width="2" opacity="0.85" />

  <!-- Inner Inset Frame -->
  <rect x="30" y="30" width="240" height="380" rx="4" fill="none" stroke="#D8CBBF" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" />

  <!-- Corner Accents -->
  <circle cx="22" cy="22" r="3.5" fill="#A4553B" opacity="0.55" />
  <circle cx="278" cy="22" r="3.5" fill="#A4553B" opacity="0.55" />
  <circle cx="22" cy="418" r="3.5" fill="#A4553B" opacity="0.55" />
  <circle cx="278" cy="418" r="3.5" fill="#A4553B" opacity="0.55" />

  <!-- Central Debossed Medallion -->
  <circle cx="150" cy="220" r="68" fill="#FAF7F2" stroke="url(#borderGlow)" stroke-width="2" filter="url(#softShadow)" />
  <circle cx="150" cy="220" r="62" fill="none" stroke="#D8CBBF" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Prominent Bookstore Emblem Icon (Zero Text) -->
  <g transform="translate(110, 180)" fill="#7D573F" opacity="0.88">
    <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z" transform="scale(5)" />
  </g>
</svg>
